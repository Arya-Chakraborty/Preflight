# Preflight example configuration.
# Copy to preflight.yaml (or pass --config) and adjust.
# For a locked-down local process see preflight.prod.yaml.
# Every field can also be set via environment variables with the PREFLIGHT_ prefix,
# e.g. PREFLIGHT_THETA_HIGH=0.98, PREFLIGHT_DATA_DIR=/tmp/preflight.

# Where SQLite databases and vector indexes live.
data_dir: ~/.preflight

# Proxy bind address.
host: 127.0.0.1
port: 8411

# --- Decision thresholds ---------------------------------------------------
# theta_high comes from `preflight calibrate` (30-pair fit: 0.7911).
# theta_low must stay strictly below it so the A2 context-reuse band is non-empty.
theta_high: 0.79      # similarity needed to serve a cached answer (A1)
theta_low: 0.60       # lower bound of the context-reuse band (A2)
lambda_fail: 0.02     # dollars charged per unit of failure probability in scoring
tau: 0.25             # hard ceiling on acceptable P[fail] per action
epsilon: 0.05         # exploration rate for the bandit (0 disables exploration)

# --- Action toggles (used to build fixed-strategy baselines) ---------------
enable_cache: true          # A1 serve-from-cache
enable_context_reuse: true  # A2 inject context from similar past requests
enable_compression: true    # A3 compress the dynamic prompt tail
enable_grounding: true      # A4 inject grounding from the local document store
# fixed_action: A5          # uncomment to force a single action (baseline mode)

# --- Analyzer ---------------------------------------------------------------
# auto = sentence-transformers when installed, hashing fallback otherwise.
# Production semantic caching should install the [memory] extra.
embedder: auto
embedding_model: sentence-transformers/all-MiniLM-L6-v2
analyzer_timeout_ms: 250   # skip remaining analysis and fall back toward A5
assembler_timeout_ms: 1000

# --- Memory -----------------------------------------------------------------
semantic_ttl_s: 86400   # T2 cached answers expire after a day
context_ttl_s: 86400    # T3 stored context freshness TTL

# --- Compression ------------------------------------------------------------
min_tail_tokens: 1500   # below this dynamic-tail size, A3 is infeasible
compression_rate: 0.5   # target keep-rate for LLMLingua-2
enable_compose: true    # A2A3 / A4A3: inject then compress the cold tail

# --- Risk / quality ----------------------------------------------------------
retry_cost_mult: 1.5    # E[C_retry] = mult * estimated raw-call cost
false_hit_alpha: 1.0    # P[false hit] ~= alpha * (1 - similarity)
audit_rate: 0.02        # fraction of A1 hits shadow-audited with a real call
retry_similarity: 0.85  # a follow-up this similar to a recent turn flags a retry
retry_window: 3         # how many previous turns in the session to compare
auto_refit_every: 0     # set e.g. 100 to refit estimators every N logged rows
uncertainty_n_min: 0    # set e.g. 8 to prefer A5 when a cheaper action is under-observed
thompson_sampling: false

# --- Proxy ops --------------------------------------------------------------
# api_key: change-me          # require Authorization: Bearer or x-api-key
#                             # dashboard: open /preflight?key=change-me
# spend_cap_usd: 10.0         # reject non-A1 calls after this global realized spend
# session_spend_cap_usd: 1.0
# allow_multi_writer: false   # exclusive data_dir lock (keep data_dir on local disk)

# --- Provider cache rules (multipliers on input price) ----------------------
cache_rules:
  openai:    { min_prefix_tokens: 1024, read_mult: 0.50, write_mult: 1.00, ttl_s: 300 }
  anthropic: { min_prefix_tokens: 1024, read_mult: 0.10, write_mult: 1.25, ttl_s: 300 }
  gemini:    { min_prefix_tokens: 2048, read_mult: 0.25, write_mult: 1.00, ttl_s: 3600 }
  default:   { min_prefix_tokens: 1024, read_mult: 0.50, write_mult: 1.00, ttl_s: 300 }
